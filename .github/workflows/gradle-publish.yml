name: Build and publish Gradle

on:
  workflow_call:
    inputs:
      project-directory:
        description: Directory containing the Gradle wrapper and build.
        type: string
        default: .
      publish-task:
        description: Gradle task that publishes the repository's intended artifacts.
        type: string
        default: publishMavenPublicationToSneakyrpRepository
      publish:
        description: Disable for projects that are not ready to publish yet.
        type: boolean
        default: true
      runs-on:
        description: JSON runner name or label array.
        type: string
        default: '["self-hosted", "Linux", "X64", "alphaarcadeus"]'
      skip-paths:
        description: >-
          Newline-separated globs, where * also matches /. A push that changes only
          matching files is skipped. Empty to always run.
        type: string
        default: |
          *.md
          docs/*
          LICENSE*
    secrets:
      INFISICAL_IDENTITY_ID:
        required: false
      INFISICAL_DOMAIN:
        required: false

permissions:
  contents: read
  id-token: write

jobs:
  # The Mother-Mouse Discord bot matches this job as "<caller job> / changes" to
  # report docs-only runs as skipped. If renaming it, coordinate with Mother-Mouse-Discord.
  changes:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check for changes outside skip-paths
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SKIP_PATHS: ${{ inputs.skip-paths }}
        run: |
          # Only pushes whose changed files all match skip-paths are skipped. Manual
          # runs, new branches, empty commits and unreachable history always run.
          run=true
          reason=
          skippable=()
          if [[ $EVENT_NAME != push || -z ${SKIP_PATHS//[[:space:]]/} ]]; then
            if [[ $EVENT_NAME != push ]]; then
              reason="not a push (event: $EVENT_NAME)"
            else
              reason="skip-paths is empty"
            fi
            echo "Running: $reason."
          elif [[ -z $BEFORE || $BEFORE =~ ^0+$ ]]; then
            reason="no previous commit to compare against"
            echo "Running: $reason."
          elif ! git fetch --no-tags --depth=1 --filter=blob:none origin "$BEFORE"; then
            reason="could not fetch previous commit $BEFORE (force-push?)"
            echo "::warning::Could not fetch $BEFORE (force-push?); running."
          else
            mapfile -t files < <(git diff --name-only --no-renames "$BEFORE" "$GITHUB_SHA")
            mapfile -t patterns < <(sed 's/^[[:space:]]*//; s/[[:space:]]*$//; /^$/d' <<< "$SKIP_PATHS")
            if (( ${#files[@]} > 0 )); then run=false; fi
            outside=0
            for file in "${files[@]}"; do
              matched=false
              for pattern in "${patterns[@]}"; do
                # shellcheck disable=SC2053 # unquoted on purpose: glob match
                if [[ $file == $pattern ]]; then matched=true; break; fi
              done
              if [[ $matched == true ]]; then
                echo "skippable: $file"
                skippable+=("$file")
              else
                echo "needs run: $file"
                run=true
                outside=$((outside + 1))
              fi
            done
            if (( ${#files[@]} == 0 )); then
              reason="no files changed (empty commit)"
            else
              reason="$outside of ${#files[@]} changed files are outside skip-paths"
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          if [[ $run == false ]]; then
            echo "::notice::Only files matching skip-paths changed; skipping."
            {
              echo "### Skipped: only documentation files changed"
              echo
              for file in "${skippable[@]}"; do echo "- \`$file\`"; done
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Running: $reason" >> "$GITHUB_STEP_SUMMARY"
          fi

  publish:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.project-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Java 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          # Runners keep a persistent shared Gradle home; skip the Actions cache round-trip.
          cache-disabled: true
      - name: Build and check
        run: bash ./gradlew build --no-daemon --console=plain
      - name: Validate Infisical configuration
        if: inputs.publish
        env:
          INFISICAL_IDENTITY_ID: ${{ secrets.INFISICAL_IDENTITY_ID }}
          INFISICAL_DOMAIN: ${{ secrets.INFISICAL_DOMAIN }}
        run: |
          : "${INFISICAL_IDENTITY_ID:?Set INFISICAL_IDENTITY_ID}"
          : "${INFISICAL_DOMAIN:?Set INFISICAL_DOMAIN}"
      - name: Fetch Maven credentials
        if: inputs.publish
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: ${{ secrets.INFISICAL_IDENTITY_ID }}
          domain: ${{ secrets.INFISICAL_DOMAIN }}
          project-slug: lords-of-minecraft
          env-slug: prod
          secret-path: /Maven
      - name: Publish
        if: inputs.publish
        env:
          PUBLISH_TASK: ${{ inputs.publish-task }}
        run: |
          : "${MAVEN_USERNAME:?Infisical must provide MAVEN_USERNAME}"
          : "${MAVEN_PASSWORD:?Infisical must provide MAVEN_PASSWORD}"
          : "${PUBLISH_TASK:?Set publish-task}"
          export ORG_GRADLE_PROJECT_sneakyrpUsername="$MAVEN_USERNAME"
          export ORG_GRADLE_PROJECT_sneakyrpPassword="$MAVEN_PASSWORD"
          bash ./gradlew "$PUBLISH_TASK" --no-daemon --console=plain
