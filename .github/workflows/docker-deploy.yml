name: Build Docker image and deploy with Watchtower

on:
  workflow_call:
    inputs:
      image-name:
        description: Image repository beneath the Infisical registry host.
        type: string
        required: true
      context:
        description: Local Docker build context within the checked-out caller.
        type: string
        default: .
      dockerfile:
        description: Optional Dockerfile path; defaults to Dockerfile in the context.
        type: string
        default: ''
      skip-paths:
        description: >-
          Newline-separated globs, where * also matches /. A push that changes only
          matching files is skipped. Empty to always run.
        type: string
        default: |
          *.md
          docs/*
          LICENSE*
    secrets:
      INFISICAL_IDENTITY_ID:
        required: true
      INFISICAL_DOMAIN:
        required: true
      WATCHTOWER_URL:
        description: Optional; replaces the Watchtower URL from Infisical.
        required: false

permissions:
  contents: read
  id-token: write

jobs:
  # The Mother-Mouse Discord bot matches this job as "<caller job> / changes" to
  # report docs-only runs as skipped. If renaming it, coordinate with Mother-Mouse-Discord.
  changes:
    runs-on: [self-hosted, Linux, X64, alphaarcadeus]
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check for changes outside skip-paths
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SKIP_PATHS: ${{ inputs.skip-paths }}
        run: |
          # Only pushes whose changed files all match skip-paths are skipped. Manual
          # runs, new branches, empty commits and unreachable history always run.
          run=true
          reason=
          skippable=()
          if [[ $EVENT_NAME != push || -z ${SKIP_PATHS//[[:space:]]/} ]]; then
            if [[ $EVENT_NAME != push ]]; then
              reason="not a push (event: $EVENT_NAME)"
            else
              reason="skip-paths is empty"
            fi
            echo "Running: $reason."
          elif [[ -z $BEFORE || $BEFORE =~ ^0+$ ]]; then
            reason="no previous commit to compare against"
            echo "Running: $reason."
          elif ! git fetch --no-tags --depth=1 --filter=blob:none origin "$BEFORE"; then
            reason="could not fetch previous commit $BEFORE (force-push?)"
            echo "::warning::Could not fetch $BEFORE (force-push?); running."
          else
            mapfile -t files < <(git diff --name-only --no-renames "$BEFORE" "$GITHUB_SHA")
            mapfile -t patterns < <(sed 's/^[[:space:]]*//; s/[[:space:]]*$//; /^$/d' <<< "$SKIP_PATHS")
            if (( ${#files[@]} > 0 )); then run=false; fi
            outside=0
            for file in "${files[@]}"; do
              matched=false
              for pattern in "${patterns[@]}"; do
                # shellcheck disable=SC2053 # unquoted on purpose: glob match
                if [[ $file == $pattern ]]; then matched=true; break; fi
              done
              if [[ $matched == true ]]; then
                echo "skippable: $file"
                skippable+=("$file")
              else
                echo "needs run: $file"
                run=true
                outside=$((outside + 1))
              fi
            done
            if (( ${#files[@]} == 0 )); then
              reason="no files changed (empty commit)"
            else
              reason="$outside of ${#files[@]} changed files are outside skip-paths"
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          if [[ $run == false ]]; then
            echo "::notice::Only files matching skip-paths changed; skipping."
            {
              echo "### Skipped: only documentation files changed"
              echo
              for file in "${skippable[@]}"; do echo "- \`$file\`"; done
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Running: $reason" >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: [self-hosted, Linux, X64, alphaarcadeus]
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate Infisical configuration
        env:
          INFISICAL_IDENTITY_ID: ${{ secrets.INFISICAL_IDENTITY_ID }}
          INFISICAL_DOMAIN: ${{ secrets.INFISICAL_DOMAIN }}
        run: |
          : "${INFISICAL_IDENTITY_ID:?Set INFISICAL_IDENTITY_ID}"
          : "${INFISICAL_DOMAIN:?Set INFISICAL_DOMAIN}"
      - name: Fetch registry credentials
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: ${{ secrets.INFISICAL_IDENTITY_ID }}
          domain: ${{ secrets.INFISICAL_DOMAIN }}
          project-slug: lords-of-minecraft
          env-slug: prod
          secret-path: /Registry
      - name: Check registry credentials
        run: |
          : "${REGISTRY_HOST:?Infisical must provide REGISTRY_HOST}"
          : "${REGISTRY_USER:?Infisical must provide REGISTRY_USER}"
          : "${REGISTRY_PASSWORD:?Infisical must provide REGISTRY_PASSWORD}"
      - name: Log in to registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY_HOST }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ env.REGISTRY_PASSWORD }}
      # Build on the shared rootless BuildKit service (see the runner compose file)
      # instead of a Docker daemon; the runner containers have no Docker socket.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          driver: remote
          endpoint: tcp://buildkitd:1234
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: true
          tags: ${{ env.REGISTRY_HOST }}/${{ inputs.image-name }}:latest
          # Lets consumers map a running image back to its commit. In a reusable
          # workflow, github.sha and github.repository refer to the caller.
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          # Dockerfiles may expose it at runtime with `ARG GIT_SHA` + `ENV GIT_SHA=$GIT_SHA`.
          build-args: |
            GIT_SHA=${{ github.sha }}
      - name: Fetch Watchtower credentials
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: ${{ secrets.INFISICAL_IDENTITY_ID }}
          domain: ${{ secrets.INFISICAL_DOMAIN }}
          project-slug: lords-of-minecraft
          env-slug: prod
          secret-path: /Watchtower
      - name: Trigger Watchtower
        env:
          # Separate name: the Infisical step exports WATCHTOWER_URL to the job env.
          WATCHTOWER_URL_OVERRIDE: ${{ secrets.WATCHTOWER_URL }}
        run: |
          WATCHTOWER_URL=${WATCHTOWER_URL_OVERRIDE:-$WATCHTOWER_URL}
          : "${WATCHTOWER_URL:?Set the WATCHTOWER_URL secret or provide it in Infisical}"
          : "${WATCHTOWER_TOKEN:?Infisical must provide WATCHTOWER_TOKEN}"
          curl --fail-with-body --show-error --silent --connect-timeout 10 --max-time 120 \
            --request POST --header "Authorization: Bearer $WATCHTOWER_TOKEN" \
            "$WATCHTOWER_URL"
