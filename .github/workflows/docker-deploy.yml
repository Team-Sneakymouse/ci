name: Build Docker image and deploy with Watchtower

on:
  workflow_call:
    inputs:
      image-name:
        description: Image repository beneath the Infisical registry host.
        type: string
        required: true
      context:
        description: Local Docker build context within the checked-out caller.
        type: string
        default: .
      dockerfile:
        description: Optional Dockerfile path; defaults to Dockerfile in the context.
        type: string
        default: ''
    secrets:
      INFISICAL_IDENTITY_ID:
        required: true
      INFISICAL_DOMAIN:
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64, alphaarcadeus]
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Ensure Docker daemon
        run: |
          set -euo pipefail
          # Prefer the host Docker CLI; never start a nested dockerd from the job.
          export PATH="/usr/bin:/bin:${PATH:-}"
          hash -r || true
          echo "whoami=$(whoami) groups=$(id -nG)"
          echo "docker binary: $(command -v docker)"
          docker version || true
          if [ ! -S /var/run/docker.sock ]; then
            echo "::error::Host Docker socket /var/run/docker.sock is missing."
            echo "The Actions runner must see the host dockerd socket."
            exit 1
          fi
          # Runner user is often not in the docker group.
          sudo chmod 666 /var/run/docker.sock
          export DOCKER_HOST=unix:///var/run/docker.sock
          if ! docker info >/dev/null 2>&1; then
            echo "::error::Cannot talk to host dockerd as $(whoami)."
            echo "Add the runner user to the docker group and restart the runner:"
            echo "  sudo usermod -aG docker $(whoami)"
            echo "  sudo systemctl restart actions.runner.*   # or your runner service name"
            ls -la /var/run/docker.sock || true
            docker version || true
            exit 1
          fi
          docker info
          echo "DOCKER_HOST=unix:///var/run/docker.sock" >> "$GITHUB_ENV"
      - name: Validate Infisical configuration
        env:
          INFISICAL_IDENTITY_ID: ${{ secrets.INFISICAL_IDENTITY_ID }}
          INFISICAL_DOMAIN: ${{ secrets.INFISICAL_DOMAIN }}
        run: |
          : "${INFISICAL_IDENTITY_ID:?Set INFISICAL_IDENTITY_ID}"
          : "${INFISICAL_DOMAIN:?Set INFISICAL_DOMAIN}"
      - name: Fetch registry credentials
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: oidc
          identity-id: ${{ secrets.INFISICAL_IDENTITY_ID }}
          domain: ${{ secrets.INFISICAL_DOMAIN }}
          project-slug: lords-of-minecraft
          env-slug: prod
          secret-path: /Registry
      - name: Log in to registry
        run: |
          : "${REGISTRY_HOST:?Infisical must provide REGISTRY_HOST}"
          : "${REGISTRY_USER:?Infisical must provide REGISTRY_USER}"
          : "${REGISTRY_PASSWORD:?Infisical must provide REGISTRY_PASSWORD}"
          printf '%s' "$REGISTRY_PASSWORD" | docker login "$REGISTRY_HOST" \
            --username "$REGISTRY_USER" --password-stdin
      - uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: true
          tags: ${{ env.REGISTRY_HOST }}/${{ inputs.image-name }}:latest
      - name: Fetch Watchtower credentials
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: oidc
          identity-id: ${{ secrets.INFISICAL_IDENTITY_ID }}
          domain: ${{ secrets.INFISICAL_DOMAIN }}
          project-slug: lords-of-minecraft
          env-slug: prod
          secret-path: /Watchtower
      - name: Trigger Watchtower
        run: |
          : "${WATCHTOWER_URL:?Infisical must provide WATCHTOWER_URL}"
          : "${WATCHTOWER_TOKEN:?Infisical must provide WATCHTOWER_TOKEN}"
          curl --fail-with-body --show-error --silent --connect-timeout 10 --max-time 120 \
            --request POST --header "Authorization: Bearer $WATCHTOWER_TOKEN" \
            "$WATCHTOWER_URL"
      - name: Log out of registry
        if: always() && env.REGISTRY_HOST != ''
        run: docker logout "$REGISTRY_HOST"
